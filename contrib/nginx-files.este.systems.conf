# files.este.systems for drop (proxied by Cloudflare; ufw lets only Cloudflare reach 80/443).
# Installed as /etc/nginx/sites-available/files.este.systems by the drop package's postinst if absent.

# Access logs never contain full tokens: /d/<token> is logged as /d/<first 6 chars>...
map $uri $drop_uri {
    "~^/(?<kind>[du])/(?<tok>[A-Za-z0-9_-]{6})"  "/$kind/$tok...";
    default                                    $uri;
}
log_format drop '$http_cf_connecting_ip [$time_local] "$request_method $drop_uri" $status $body_bytes_sent '
                '"$http_user_agent" aop=$ssl_client_verify';
# per-visitor rate limit (Cloudflare's CF-Connecting-IP: the origin is only reachable through Cloudflare)
limit_req_zone $http_cf_connecting_ip zone=drop:10m rate=5r/s;

server {                                   # anything not asking for files.este.systems
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.este.systems;
    access_log /var/log/nginx/files.access.log drop;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files.este.systems;

    ssl_certificate     /etc/letsencrypt/live/files.este.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.este.systems/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare Authenticated Origin Pulls: nginx asks for Cloudflare's client certificate; the
    # enforcing rule lives in the snippet that `drop-aop enforce` writes (empty = not enforced)
    ssl_client_certificate /usr/share/drop/cloudflare-origin-pull-ca.pem;
    ssl_verify_client optional;
    include /etc/nginx/snippets/drop-aop.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/files.access.log drop;

    location = / { default_type text/plain; return 200 "files.este.systems\n"; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /assets/drop.js { proxy_pass http://127.0.0.1:8081; }

    location /d/ {                          # download links: GET shows the page, POST uses the link
        limit_except GET POST { deny all; }
        limit_req zone=drop burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_http_version 1.1;
    }

    location /u/ {                          # upload links: GET shows the page, PUT sends the file
        limit_except GET PUT { deny all; }
        limit_req zone=drop burst=20 nodelay;
        client_max_body_size 100m;          # Cloudflare (free plan) rejects larger bodies anyway
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_http_version 1.1;
    }

    location /_files/ {                     # reachable only through drop's X-Accel-Redirect
        internal;
        alias /srv/drop/files/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
